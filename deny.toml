[advisories]
version = 2
# Unsoundness can cause undefined behavior even through transitive/dev dependencies.
unsound = "all"
# Unmaintained packages block when they are direct workspace dependencies.
unmaintained = "workspace"
yanked = "warn"
unused-ignored-advisory = "deny"
ignore = [
  # tracking: https://github.com/VOID-TECHNOLOGY-INC/PyBun/issues/434
  # owner: release/security maintainers
  # review-by: 2026-12-07
  { id = "RUSTSEC-2025-0141", reason = "Temporary bincode 1.x compatibility exception; tracking #434; review by 2026-12-07" },
]

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "OpenSSL",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[sources]
unknown-git = "warn"
unknown-registry = "warn"

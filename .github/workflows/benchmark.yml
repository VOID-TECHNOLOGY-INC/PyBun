name: Benchmark retention verification
'on':
  workflow_dispatch: null
permissions: {}
jobs:
  ux-gate:
    if: 'github.event_name != ''pull_request'' || contains(github.event.pull_request.labels.*.name,
      ''benchmark'') || contains(github.event.pull_request.labels.*.name, ''perf'')

      '
    name: retention (${{ matrix.os }}, ${{ matrix.case }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - macos-latest
        case:
        - gate-failure
        - no-results
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.11'
    - name: Prepare deterministic failure evidence
      if: matrix.case == 'gate-failure'
      run: 'mkdir -p scripts/benchmark/results-ci

        cp scripts/benchmark/tests/fixtures/benchmark_gate_failure.json scripts/benchmark/results-ci/benchmark_gate_failure.json

        '
    - name: UX gate
      run: 'cd scripts/benchmark

        python ux_gate.py results-ci --criteria ux_criteria.toml --format text

        '
    - name: Upload results
      if: ${{ !cancelled() && hashFiles('scripts/benchmark/results-ci/**') != '' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: benchmark-results-${{ matrix.os }}
        path: scripts/benchmark/results-ci/
        if-no-files-found: error

name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["*"]

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Install Python test dependencies
        run: python -m pip install pytest PyYAML
      - name: Bootstrap unit tests
        run: python -m unittest discover -s pybun/tests -v
      - name: Release tooling unit tests
        run: python -m unittest discover -s scripts/release/tests -v
      - name: Benchmark unit tests (offline)
        run: python -m pytest scripts/benchmark/tests -q
      - name: Workflow regression tests
        run: python -m unittest discover -s scripts/ci/tests -v

  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install minisign
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y minisign
          else
            brew install minisign
          fi
      - name: Set up Python for pytest marker regressions
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install pytest for runtime marker evaluation
        run: python -m pip install pytest==9.0.2
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-targets: true
          cache-on-failure: true
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Set up Python for runtime integration tests
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Install pytest for runtime integration tests
        run: python3 -m pip install pytest
      - name: test
        run: cargo test

  package-managers:
    name: package managers (brew)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_SANDBOX_LINUX: 1
      HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Homebrew (Linux)
        if: runner.os == 'Linux'
        run: |
          if ! command -v brew >/dev/null 2>&1; then
            /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
      - name: Prepare Homebrew test tarball
        shell: bash
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          if [ "$RUNNER_OS" = "macOS" ]; then
            if [ "$arch" = "arm64" ]; then
              target="aarch64-apple-darwin"
            else
              target="x86_64-apple-darwin"
            fi
          else
            if [ "$arch" = "aarch64" ] || [ "$arch" = "arm64" ]; then
              target="aarch64-unknown-linux-gnu"
            else
              target="x86_64-unknown-linux-gnu"
            fi
          fi
          tmpdir="$(mktemp -d)"
          mkdir -p "$tmpdir/pybun-$target"
          cat > "$tmpdir/pybun-$target/pybun" <<'SH'
          #!/usr/bin/env bash
          if [ "$1" = "--version" ]; then
            echo "pybun test"
            exit 0
          fi
          echo "pybun test"
          SH
          chmod +x "$tmpdir/pybun-$target/pybun"
          tarball="$tmpdir/pybun-test.tar.gz"
          tar -czf "$tarball" -C "$tmpdir" "pybun-$target"
          sha="$(shasum -a 256 "$tarball" | awk '{print $1}')"
          echo "PYBUN_TEST_TARBALL=$tarball" >> "$GITHUB_ENV"
          echo "PYBUN_TEST_SHA=$sha" >> "$GITHUB_ENV"
      - name: Brew install from tap
        shell: bash
        run: |
          brew tap VOID-TECHNOLOGY-INC/PyBun "$PWD"
          tap_repo="$(brew --repo VOID-TECHNOLOGY-INC/PyBun)"
          git -C "$tap_repo" checkout "$GITHUB_SHA"
          HOMEBREW_PYBUN_TEST_TARBALL="file://$PYBUN_TEST_TARBALL" \
          HOMEBREW_PYBUN_TEST_SHA256="$PYBUN_TEST_SHA" \
            brew install VOID-TECHNOLOGY-INC/PyBun/pybun
          brew test VOID-TECHNOLOGY-INC/PyBun/pybun

  security-audit:
    name: security audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-targets: true
          cache-on-failure: true
      - name: Install audit tools
        run: |
          cargo install cargo-audit --locked
          cargo install cargo-deny --locked
          python -m pip install --upgrade pip pip-audit
      - name: Cargo audit
        run: cargo audit --deny unsound
      - name: Cargo deny advisories
        run: cargo deny --all-features check advisories
      - name: Cargo license scan
        run: cargo deny check licenses
      - name: Pip audit
        run: pip-audit --progress-spinner off .

  coverage:
    name: code coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install minisign
        # Required so self_update integration tests cover the minisign verification path
        run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Set up Python for pytest marker regressions
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install pytest for runtime marker evaluation
        run: python -m pip install pytest==9.0.2
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: llvm-tools-preview
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-targets: true
          cache-on-failure: true
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@4e14a60b36eb62630dcc25614f0be0659ab8830c # cargo-llvm-cov
      - name: Set up Python for runtime integration tests
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Install pytest for runtime integration tests
        run: python3 -m pip install pytest
      - name: Generate coverage report
        run: |
          cargo llvm-cov \
            --workspace \
            --lcov \
            --output-path lcov.info \
            --exclude-from-report "downloader_integration"
      - name: Upload coverage report as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lcov-report
          path: lcov.info
          retention-days: 30
      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      - name: Enforce coverage ratchet
        # Baseline measured on main via `cargo llvm-cov report` (line coverage) was 84.51%
        # (2026-07-24, see docs/PLAN.md Issue #348). The gate is set to baseline - 1 (83%),
        # rounded down, to absorb measurement noise while still catching regressions.
        #
        # `--exclude-from-report` is not a valid flag on the `report` subcommand (it only
        # applies at profile-generation time, in the "Generate coverage report" step above);
        # `cargo llvm-cov report` here reads that same already-filtered profile data, so the
        # 83% threshold is directly comparable to the 84.51% baseline without repeating the
        # flag.
        #
        # Ratchet-up policy: this is a floor, not the target (project policy is 80%+ line
        # coverage, and we're already above that). When coverage improves and stays improved
        # across a few PRs, bump --fail-under-lines upward (and update the baseline comment
        # here plus docs/PLAN.md) manually — there is no automation for raising the ratchet.
        run: cargo llvm-cov report --fail-under-lines 83

  windows-check:
    name: windows compile check
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-targets: true
          cache-on-failure: true
      - name: check
        shell: bash
        run: cargo check --all-targets --all-features
      - name: clippy
        shell: bash
        run: cargo clippy --all-targets --all-features -- -D warnings

  winget-validate:
    name: winget validate
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate winget manifest
        shell: pwsh
        run: |
          if (Get-Command winget -ErrorAction SilentlyContinue) {
            winget validate --manifest winget/pybun.yaml
          } else {
            Write-Host "winget not available; skipping"
          }
